<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".7"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".2"/></linearGradient><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".5" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowPurple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseOrb1{0%{transform:scale(1) translate(0,0);opacity:.45}50%{transform:scale(1.18) translate(30px,-20px);opacity:.7}}@keyframes pulseOrb2{0%{transform:scale(1) translate(0,0);opacity:.4}50%{transform:scale(1.22) translate(-25px,25px);opacity:.65}}@keyframes flowDash{0%{stroke-dashoffset:200}}@keyframes nodeFloat{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes cardShimmer{0%{stroke-opacity:.3}50%{stroke-opacity:.8}}.font-sub,.font-title{font-family:-apple-system,BlinkMacSyste