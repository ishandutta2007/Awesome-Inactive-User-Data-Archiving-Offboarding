<svg fill="none" viewBox="0 0 1200 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>

    <!-- Subtle Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .font-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .font-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      /* CSS Keyframe Animations */
      @keyframes pulseOrb1 {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
        50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.7; }
        100% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
      }
      @keyframes pulseOrb2 {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.4; }
        50% { transform: scale(1.22) translate(-25px, 25px); opacity: 0.65; }
        100% { transform: scale(1) translate(0px, 0px); opacity: 0.4; }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodeFloat {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }
      @keyframes cardShimmer {
        0% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
        100% { stroke-opacity: 0.3; }
      }

      .animated-orb-1 {
        transform-origin: 180px 140px;
        animation: pulseOrb1 9s ease-in-out infinite;
      }
      .animated-orb-2 {
        transform-origin: 1040px 280px;
        animation: pulseOrb2 11s ease-in-out infinite;
      }
      .animated-flow-line {
        stroke-dasharray: 8 6;
        animation: flowDash 15s linear infinite;
      }
      .node-float-1 {
        animation: nodeFloat 5s ease-in-out infinite;
      }
      .node-float-2 {
        animation: nodeFloat 6s ease-in-out infinite 1s;
      }
      .node-float-3 {
        animation: nodeFloat 5.5s ease-in-out infinite 2s;
      }
      .shimmer-card {
        animation: cardShimmer 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- Animated Glowing Background Orbs (Behind everything) -->
  <g class="animated-orb-1">
    <circle cx="180" cy="140" r="160" fill="url(#accentCyan)" filter="url(#glowCyan)" />
  </g>
  <g class="animated-orb-2">
    <circle cx="1040" cy="280" r="180" fill="url(#accentPurple)" filter="url(#glowPurple)" />
  </g>

  <!-- Dynamic Circuit / Pipeline Network (Deep Background) -->
  <g opacity="0.35">
    <!-- Curved connection lines -->
    <path d="M 120 330 C 240 330, 320 370, 480 370 S 720 330, 880 330 S 1020 370, 1100 370" 
          fill="none" stroke="#38bdf8" stroke-width="2" class="animated-flow-line" />
    <path d="M 80 100 C 260 100, 360 40, 600 40 S 840 90, 1120 70" 
          fill="none" stroke="#818cf8" stroke-width="1.5" class="animated-flow-line" />
  </g>

  <!-- Dynamic Visual Badges / Interactive Flow Elements (Bottom Tier) -->
  <!-- Node 1: Inactive User Detection -->
  <g class="node-float-1" transform="translate(100, 310)">
    <rect width="210" height="48" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" class="shimmer-card" opacity="0.95" />
    <circle cx="28" cy="24" r="8" fill="#ef4444" opacity="0.8"/>
    <circle cx="28" cy="24" r="4" fill="#fca5a5" />
    <text x="48" y="29" fill="#e2e8f0" font-size="13" class="font-sub" font-weight="600">Inactive User Detection</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g opacity="0.6">
    <path d="M 315 334 L 345 334" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <polygon points="345,331 352,334 345,337" fill="#64748b" />
  </g>

  <!-- Node 2: Automated Offboarding -->
  <g class="node-float-2" transform="translate(360, 310)">
    <rect width="220" height="48" rx="24" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" class="shimmer-card" opacity="0.95" />
    <circle cx="28" cy="24" r="8" fill="#f59e0b" opacity="0.8"/>
    <circle cx="28" cy="24" r="4" fill="#fde68a" />
    <text x="48" y="29" fill="#e2e8f0" font-size="13" class="font-sub" font-weight="600">Access Revocation &amp; JML</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g opacity="0.6">
    <path d="M 585 334 L 615 334" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <polygon points="615,331 622,334 615,337" fill="#64748b" />
  </g>

  <!-- Node 3: Mailbox & Data Archival -->
  <g class="node-float-3" transform="translate(630, 310)">
    <rect width="220" height="48" rx="24" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" class="shimmer-card" opacity="0.95" />
    <circle cx="28" cy="24" r="8" fill="#3b82f6" opacity="0.8"/>
    <circle cx="28" cy="24" r="4" fill="#93c5fd" />
    <text x="48" y="29" fill="#e2e8f0" font-size="13" class="font-sub" font-weight="600">Mailbox &amp; Data Archival</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <g opacity="0.6">
    <path d="M 855 334 L 885 334" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <polygon points="885,331 892,334 885,337" fill="#64748b" />
  </g>

  <!-- Node 4: Compliance & Retention -->
  <g class="node-float-1" transform="translate(900, 310)">
    <rect width="200" height="48" rx="24" fill="#0f172a" stroke="#10b981" stroke-width="1.2" class="shimmer-card" opacity="0.95" />
    <circle cx="28" cy="24" r="8" fill="#10b981" opacity="0.8"/>
    <circle cx="28" cy="24" r="4" fill="#6ee7b7" />
    <text x="48" y="29" fill="#e2e8f0" font-size="13" class="font-sub" font-weight="600">Retention &amp; Audit</text>
  </g>

  <!-- Foreground Text Content - Centered, Crisp, Unobstructed -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-size="12" class="font-mono" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM GUIDE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="150" text-anchor="middle" fill="url(#textGrad)" font-size="44" class="font-title">
    Inactive User Data Archiving &amp; Offboarding
  </text>

  <!-- Subtitle -->
  <text x="600" y="196" text-anchor="middle" fill="#f8fafc" font-size="20" class="font-sub" font-weight="600">
    Enterprise Identity Governance • Automated Deprovisioning • Secure Data Retention
  </text>

  <!-- Tagline / Secondary Detail -->
  <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-size="14" class="font-sub">
    Top SaaS Management Platforms (SMP) &amp; Open-Source Identity &amp; Access Management (IAM/IGA)
  </text>

  <!-- Subtle Border for Banner -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>
</svg>
